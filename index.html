<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>@MPHS Official | Pautan Rasmi</title>
  <meta name="description" content="Pautan rasmi Majlis Perbandaran Hulu Selangor (MPHS): e-bilitan, portal EIS, aplikasi MPHS GO dan banyak lagi.">
  <meta property="og:title" content="@MPHS Official">
  <meta property="og:description" content="Pautan rasmi Majlis Perbandaran Hulu Selangor (MPHS).">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/logo.png">
  <link rel="icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Fon Blogger Sans: letakkan fail BloggerSans.ttf dan BloggerSans-Bold.ttf bersebelahan index.html */
    @font-face {
      font-family: "Blogger Sans";
      src: local("Blogger Sans"), url("blogger-sans.bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Blogger Sans";
      src: local("Blogger Sans"), url("blogger-sans.regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* Tukar gambar latar di sini (atau gantikan fail background.jpg) */
      --bg-image: url("background.png");
      --bg-opacity: 0.15;

      --bg: #000000;
      --surface: #0d0d4d;
      --ink: #f2f4ff;
      --muted: #a9afd6;
      --line: #27277a;
      --brand: #4fbf84;
      --brand-ink: #000035;
      --accent: #f0b93a;
      --focus: #8ab4f8;
      --shadow: none;
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
      padding: max(32px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
    }

    .wrap { max-width: 540px; margin: 0 auto; }

    /* Gambar latar (opacity 70%) di atas warna #000035 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: var(--bg-opacity);
      pointer-events: none;
    }

    header, h2, footer { text-shadow: 0 1px 8px rgba(0, 0, 53, .85); }

    /* Header */
    header { text-align: center; margin-bottom: 28px; }
    .logo {
      width: 208px; height: 208px;
      margin: 0 auto 22px;
      display: grid; place-items: center;
      background: #ffffff;
      border: 3px solid var(--accent);
      border-radius: 50%;
      overflow: hidden;
    }
    .logo img { width: 86%; height: 86%; object-fit: contain; }
    h1 {
      font-family: "Blogger Sans", "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 700;
      font-size: 1.75rem;
      letter-spacing: -.01em;
    }
    .tagline { color: var(--muted); font-size: .95rem; margin-top: 4px; }

    /* Social row */
    .social { display: flex; justify-content: center; gap: 12px; margin-top: 18px; }
    .social a {
      width: 46px; height: 46px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--brand);
      color: var(--brand-ink);
      transition: transform .15s ease;
    }
    .social a:hover { transform: translateY(-2px); }
    .social svg { width: 22px; height: 22px; fill: currentColor; }

    /* Link groups (dropdown) */
    section + section { margin-top: 12px; }
    details {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    summary {
      list-style: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 16px;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: #FFEA00;
      text-transform: capitalize;
      -webkit-tap-highlight-color: transparent;
    }
    summary::-webkit-details-marker { display: none; }
    summary .chev {
      width: 20px; height: 20px; flex: none;
      stroke: #FFEA00; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
      transition: transform .2s ease;
    }
    details[open] > summary .chev { transform: rotate(180deg); }
    details[open] > summary { border-bottom: 1px solid var(--line); }
    .panel { padding: 12px; }
    ul { list-style: none; display: grid; gap: 10px; }

    .link {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 5px solid var(--brand);
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: border-color .15s ease, background .15s ease;
    }
    .link:hover { border-left-color: var(--accent); }
    .link .text { flex: 1; min-width: 0; }
    .link .title { display: block; font-weight: 600; }
    .link .desc { display: block; font-size: .85rem; color: var(--muted); margin-top: 2px; }
    .link .ext { width: 18px; height: 18px; flex: none; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    footer { margin-top: 36px; text-align: center; font-size: .8rem; color: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="logo">
        <!-- Letakkan fail logo anda sebagai /logo.png (sebelah index.html) -->
        <img src="logo.png" alt="Logo MPHS"
             onerror="this.onerror=null;this.src='https://ugc.production.linktr.ee/111fc636-5abc-48bf-b2dd-9bbfc742b61d_Logo-MPHS-compress2--PNG--min.png?io=true&size=avatar-v3_0'">
      </div>
      <h1>@MPHS</h1>
      <p class="tagline">Majlis Perbandaran Hulu Selangor</p>
      <nav class="social" id="social" aria-label="Media sosial"></nav>
    </header>

    <div id="groups"></div>

    <footer>
      <p>&copy; <span id="year"></span> Majlis Perbandaran Hulu Selangor</p>
      <p><em>MPHS Smart Link</em></p>
    </footer>
  </main>

  <script>
    /* ====== EDIT BAHAGIAN INI SAHAJA ====== */
    const SOCIAL = [
      { name: "Instagram", url: "https://www.instagram.com/mphuluselangor/?hl=en",  /* TUKAR: pautan Instagram MPHS */
        icon: "M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 0 1 12 7.5zm0 2A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5zM17.25 6a1.25 1.25 0 1 1-1.25 1.25A1.25 1.25 0 0 1 17.25 6z" },
      { name: "Facebook", url: "https://www.facebook.com/MajlisPerbandaranHuluSelangor",
        icon: "M13.5 22v-8.2h2.8l.5-3.3h-3.3V8.4c0-.95.4-1.7 1.8-1.7H17V3.7C16.6 3.6 15.6 3.5 14.6 3.5c-2.6 0-4.3 1.6-4.3 4.4v2.6H7.5v3.3h2.8V22h3.2z" },
      { name: "TikTok", url: "https://www.tiktok.com/@mphuluselangor",   /* TUKAR: pautan YouTube MPHS */
        icon: "M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z" },
    ];

    const GROUPS = [
      {
        title: "PAUTAN PANTAS",
        links: [
          { title: "Laman Web Rasmi MPHS", desc: "Portal MPHS", url: "https://mphs.gov.my/ms/" },
          { title: "Ahli Majlis MPHS", desc: "Zon Ahli Majlis MPHS", url: "https://mphs.gov.my/ms/mphs/info-korporat/pengurusan/profil-ahli-majlis" },
          { title: "Pembayaran E-Billing", desc: "Bayar cukai dan bil MPHS", url: "https://ebilling.mphs.gov.my:62002/MDHS/Payment" },
          { title: "Tourism Hulu Selangor", desc: "Tempat menarik dan acara", url: "https://linktr.ee/VisitHuluSelangor" },
          { title: "EIS MPHS", desc: "Portal sistem maklumat bersepadu", url: "https://eis.mphs.gov.my/portal/apps/sites/#/eis-mphs" },
          { title: "Laluan Bas Smart Selangor", desc: "Peta laluan BSS 2025 (awam)", url: "https://www.google.com/maps/d/edit?mid=14x1ESXK43ERxC4qmukH57ugc2AybpM8&usp=sharing" }
        ]
      },
      {
        title: "Maklumat & pengumuman",
        links: [
          { title: "Premis Penginapan Berdaftar", desc: "Senarai premis penginapan di Hulu Selangor", url: "https://eis.mphs.gov.my/portal/apps/storymaps/stories/bd786765030642d19f552864bc34862b" },
          { title: "Dasar Penempatan Pekerja Asing", desc: "Garis panduan asrama pekerja asing", url: "https://mphs.gov.my/images/pengumuman/Dasar_Asrama_Pekerja_Asing_MPHS_2023.png" },
          { title: "Highspeed Hulu Selangor", desc: "Kebenaran Merancang", url: "https://drive.google.com/file/d/1EoGsdTDRgrRnRnQye6ufUZ3Yol05fInC/view?usp=sharing" },
          { title: "E-OKU MPHS", desc: "Sistem pendaftaran OKU", url: "https://sistem-e-oku.vercel.app/" },
          { title: "Muat Turun Borang", desc: "Borang-Borang", url: "https://www.mphs.gov.my/ms/mphs/perkhidmatan/muat-turun-borang" }
        ]
      },
      {
        title: "MPHS GO",
        links: [
          { title: "MPHS GO (Android)", desc: "Muat turun aplikasi di Google Play", url: "https://play.google.com/store/search?q=mphs%20go&c=apps&hl=en" },
          { title: "MPHS GO (Apple)", desc: "Muat turun aplikasi di App Store", url: "https://apps.apple.com/my/app/mphs-go/id6818049937" },
        ]
      }
    ];
    /* ====== TAMAT ====== */

    const EXT = '<svg class="ext" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
    const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    document.getElementById("social").innerHTML = SOCIAL.map(s =>
      `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(s.name)} MPHS">
         <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${s.icon}"/></svg>
       </a>`
    ).join("");

    const CHEV = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

    document.getElementById("groups").innerHTML = GROUPS.map((g, i) =>
      `<section>
         <details ${i === 0 ? "open" : ""}>
           <summary>${esc(g.title)}${CHEV}</summary>
           <div class="panel">
             <ul>${g.links.map(l =>
               `<li><a class="link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">
                  <span class="text">
                    <span class="title">${esc(l.title)}</span>
                    <span class="desc">${esc(l.desc)}</span>
                  </span>${EXT}
                </a></li>`).join("")}
             </ul>
           </div>
         </details>
       </section>`
    ).join("");

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
